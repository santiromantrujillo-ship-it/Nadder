<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nadder">
  <title>Nadder House Hunt</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root{--teal:#1E7A8A;--teal-dark:#155E6C;--white:#fff;--gray-light:#f5f7f8;--gray:#e2e6e8;--text:#1a1a1a;--muted:#6b7280;}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:#fff;display:flex;flex-direction:column;max-width:480px;margin:0 auto;height:100dvh;}
    .header{background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));min-height:54px;flex-shrink:0;position:relative;}
    .hdr-title{font-size:18px;font-weight:600;position:absolute;left:50%;transform:translateX(-50%);}
    .hdr-l{width:36px;} .hdr-r{min-width:36px;display:flex;justify-content:flex-end;}
    .add-btn{background:#fff;color:var(--teal);border:none;border-radius:20px;padding:7px 13px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap;}
    .search-wrap{background:var(--teal);padding:0 14px 10px;flex-shrink:0;display:none;}
    .search-inner{position:relative;}
    .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.65);font-size:14px;}
    .search-input{width:100%;background:rgba(255,255,255,.18);border:none;border-radius:10px;padding:9px 12px 9px 32px;color:#fff;font-size:15px;outline:none;}
    .search-input::placeholder{color:rgba(255,255,255,.65);}
    .screen{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0;}
    .screen.active{display:flex;}
    .map-wrap{position:relative;flex:1;min-height:0;}
    #leaflet-map{width:100%;height:100%;}
    .map-fab{position:absolute;top:12px;right:12px;z-index:500;background:#fff;color:var(--teal);border:none;border-radius:22px;padding:9px 16px;font-size:14px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.2);cursor:pointer;}
    .bcard{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;padding:18px 18px 24px;box-shadow:0 -4px 24px rgba(0,0,0,.14);transform:translateY(110%);transition:transform .32s cubic-bezier(.32,.72,0,1);z-index:500;cursor:pointer;}
    .bcard.show{transform:translateY(0);}
    .bc-title{font-size:17px;font-weight:700;color:var(--text);}
    .bc-addr{font-size:13px;color:var(--muted);margin-top:3px;}
    .bc-hint{font-size:12px;color:var(--teal);margin-top:8px;font-weight:500;}
    .logo-bar{background:#fff;display:flex;align-items:center;justify-content:center;padding:10px 0 8px;flex-shrink:0;border-top:1px solid var(--gray);}
    .logo-bar img{height:56px;object-fit:contain;}
    .list-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .hrow{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--gray);cursor:pointer;gap:12px;transition:background .12s;}
    .hrow:active{background:var(--gray-light);}
    .hrow-body{flex:1;}
    .hrow-title{font-size:16px;font-weight:600;color:var(--text);}
    .hrow-addr{font-size:13px;color:var(--muted);margin-top:2px;}
    .hrow-dots{color:var(--muted);font-size:20px;}
    .cal-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;}
    .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .cal-mo{font-size:18px;font-weight:600;}
    .cal-navs{display:flex;gap:6px;}
    .cal-nb{width:32px;height:32px;border-radius:50%;border:1px solid var(--gray);background:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
    .cal-dh{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:4px 0;}
    .cal-cell{min-height:58px;border:1px solid var(--gray);border-radius:5px;padding:3px 2px;background:#fff;}
    .cal-cell.other{background:var(--gray-light);}
    .cal-cell.today{background:rgba(30,122,138,.07);border-color:var(--teal);}
    .cal-num{font-size:11px;color:var(--muted);margin-bottom:2px;}
    .cal-cell.today .cal-num{color:var(--teal);font-weight:700;}
    .cal-evt{background:var(--teal);color:#fff;border-radius:3px;font-size:9px;padding:1px 3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:none;align-items:flex-end;justify-content:center;}
    .overlay.open{display:flex;}
    .sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(24px,env(safe-area-inset-bottom));}
    .sh-handle{width:38px;height:4px;background:var(--gray);border-radius:2px;margin:12px auto 0;}
    .sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--gray);}
    .sh-title{font-size:17px;font-weight:600;}
    .sh-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:2px 6px;}
    .sh-body{padding:18px;}
    .det-title{font-size:22px;font-weight:700;}
    .det-addr{font-size:14px;color:var(--muted);margin-top:4px;}
    .det-edit{display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;margin-top:14px;}
    .det-fields{margin-top:18px;}
    .det-row{display:flex;justify-content:space-between;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--gray);gap:16px;}
    .det-lbl{font-size:15px;color:var(--muted);flex-shrink:0;}
    .det-val{font-size:14px;color:var(--text);text-align:right;max-width:62%;}
    .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;}
    .badge-y{background:#e8f5e9;color:#2e7d32;} .badge-n{background:#fff3e0;color:#bf360c;}
    .fg{margin-bottom:16px;}
    .fl{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
    .fi,.fta,.fsel{width:100%;padding:11px 13px;border:1.5px solid var(--gray);border-radius:10px;font-size:15px;outline:none;font-family:inherit;color:var(--text);background:#fff;}
    .fi:focus,.fta:focus{border-color:var(--teal);}
    .fta{min-height:80px;resize:vertical;}
    .save-btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;}
    .tabbar{display:flex;background:#fff;border-top:1px solid var(--gray);flex-shrink:0;padding-bottom:max(0px,env(safe-area-inset-bottom));}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;gap:3px;border:none;background:none;color:var(--muted);font-size:10px;cursor:pointer;transition:color .15s;}
    .tab.active{color:var(--teal);}
    .tab svg{width:24px;height:24px;}
    .tab-lbl{font-size:9px;}
  </style>
</head>
<body>
<div class="header">
  <div class="hdr-l"></div>
  <span class="hdr-title" id="hdr-title">Map</span>
  <div class="hdr-r" id="hdr-action"></div>
</div>
<div class="search-wrap" id="search-wrap">
  <div class="search-inner">
    <span class="search-icon">&#128269;</span>
    <input class="search-input" id="search-inp" placeholder="Search" type="search">
  </div>
</div>
<!-- MAP -->
<div class="screen active" id="scr-map">
  <div class="map-wrap">
    <div id="leaflet-map"></div>
    <button class="map-fab" onclick="openAdd()">+ Add House!</button>
    <div class="bcard" id="bcard" onclick="openDetail(selId)">
      <div class="bc-title" id="bc-title"></div>
      <div class="bc-addr" id="bc-addr"></div>
      <div class="bc-hint">Tap to view details &#8594;</div>
    </div>
  </div>
  <div class="logo-bar"><img id="logo-img" src="" alt="Nadder"></div>
</div>
<!-- TOUR -->
<div class="screen" id="scr-tour">
  <div class="cal-scroll">
    <div class="cal-head">
      <span class="cal-mo" id="cal-lbl"></span>
      <div class="cal-navs">
        <button class="cal-nb" onclick="chMonth(-1)">&#8249;</button>
        <button class="cal-nb" onclick="chMonth(1)">&#8250;</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>
<!-- HOUSE BOOK -->
<div class="screen" id="scr-book">
  <div class="list-scroll" id="house-list"></div>
</div>
<!-- DETAIL -->
<div class="overlay" id="ov-detail">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-head">
      <span class="sh-title" id="det-sh-title"></span>
      <button class="sh-close" onclick="closeOv('ov-detail')">&#10005;</button>
    </div>
    <div class="sh-body" id="det-body"></div>
  </div>
</div>
<!-- FORM -->
<div class="overlay" id="ov-form">
  <div class="sheet">
    <div class="sh-handle"></div>
    <div class="sh-head">
      <span class="sh-title" id="form-lbl">Add House</span>
      <button class="sh-close" onclick="closeOv('ov-form')">&#10005;</button>
    </div>
    <div class="sh-body">
      <input type="hidden" id="f-id">
      <div class="fg"><label class="fl">Title</label><input class="fi" id="f-title" placeholder="Cambridge Apartments"></div>
      <div class="fg"><label class="fl">Address</label><input class="fi" id="f-addr" placeholder="123 N Main St, Provo, UT"></div>
      <div class="fg"><label class="fl">Phone Number</label><input class="fi" id="f-num" type="tel" placeholder="(801) 555-0000"></div>
      <div class="fg"><label class="fl">Price</label><input class="fi" id="f-price" placeholder="~$1,200/mo"></div>
      <div class="fg"><label class="fl">Visited?</label>
        <select class="fi fsel" id="f-vis">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
          <option value="Yes (Santi)">Yes (Santi)</option>
        </select>
      </div>
      <div class="fg"><label class="fl">Location from Campus</label><input class="fi" id="f-loc" placeholder="5 min walk"></div>
      <div class="fg"><label class="fl">Notes</label><textarea class="fta" id="f-notes" placeholder="Any notes..."></textarea></div>
      <div class="fg"><label class="fl">Tour Date</label><input class="fi" id="f-tour" placeholder="May 12 at 9 AM"></div>
      <button class="save-btn" onclick="saveHouse()">Save</button>
    </div>
  </div>
</div>
<!-- TAB BAR -->
<div class="tabbar">
  <button class="tab active" id="tab-map" onclick="goTab('map')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
    <span class="tab-lbl">Map</span>
  </button>
  <button class="tab" id="tab-tour" onclick="goTab('tour')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span class="tab-lbl">Tour Schedule</span>
  </button>
  <button class="tab" id="tab-book" onclick="goTab('book')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="tab-lbl">House Book</span>
  </button>
</div>

let houses=JSON.parse(localStorage.getItem('nadder-v1')||'null')||DEFAULT;
function save(){localStorage.setItem('nadder-v1',JSON.stringify(houses));}
let curTab='map',calMonth=new Date().getMonth(),calYear=new Date().getFullYear();
let lmap=null,markers={},selId=null;

document.getElementById('logo-img').src=LOGO;

function goTab(t){
  curTab=t;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('scr-'+t).classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
  const T={map:'Map',tour:'Tour Schedule',book:'House Book'};
  document.getElementById('hdr-title').textContent=T[t];
  const sw=document.getElementById('search-wrap'),ha=document.getElementById('hdr-action');
  if(t==='map'){sw.style.display='none';ha.innerHTML='';setTimeout(()=>lmap&&lmap.invalidateSize(),120);}
  else if(t==='tour'){sw.style.display='none';ha.innerHTML='';renderCal();}
  else{sw.style.display='block';ha.innerHTML='<button class="add-btn" onclick="openAdd()">&#65291;</button>';renderList();}
}

function pinIcon(v){
  const c=(v==='Yes'||v==='Yes (Santi)')?'#2e7d32':'#1E7A8A';
  return L.divIcon({className:'',html:`<div style="width:28px;height:28px;background:${c};border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid white;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>`,iconSize:[28,28],iconAnchor:[14,28]});
}

function addMarker(h){
  if(!lmap||!h.lat||!h.lng)return;
  if(markers[h.id])markers[h.id].remove();
  const m=L.marker([h.lat,h.lng],{icon:pinIcon(h.visited)}).addTo(lmap);
  m.on('click',()=>showCard(h.id));
  markers[h.id]=m;
}

async function geo(addr){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}&limit=1`,{headers:{'Accept-Language':'en'}});const d=await r.json();if(d[0])return{lat:+d[0].lat,lng:+d[0].lon};}catch(e){}return null;
}

async function geocodeAll(){
  let updated=false;
  for(let i=0;i<houses.length;i++){
    if(!houses[i].lat){await new Promise(r=>setTimeout(r,1100));const c=await geo(houses[i].address);if(c){houses[i].lat=c.lat;houses[i].lng=c.lng;updated=true;}}
    addMarker(houses[i]);
  }
  if(updated)save();
}

function showCard(id){
  selId=id;const h=houses.find(x=>x.id===id);
  document.getElementById('bc-title').textContent=h.title;
  document.getElementById('bc-addr').textContent=h.address;
  document.getElementById('bcard').classList.add('show');
}

function initMap(){
  lmap=L.map('leaflet-map',{center:[40.246,-111.648],zoom:13,zoomControl:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(lmap);
  L.control.zoom({position:'bottomright'}).addTo(lmap);
  lmap.on('click',()=>{document.getElementById('bcard').classList.remove('show');selId=null;});
  geocodeAll();
}

function renderList(q=''){
  const q2=q.toLowerCase();
  const rows=houses.filter(h=>!q2||h.title.toLowerCase().includes(q2)||h.address.toLowerCase().includes(q2));
  document.getElementById('house-list').innerHTML=rows.map(h=>`<div class="hrow" onclick="openDetail(${h.id})"><div class="hrow-body"><div class="hrow-title">${h.title}</div><div class="hrow-addr">${h.address}</div></div><span class="hrow-dots">&#8943;</span></div>`).join('');
}
document.getElementById('search-inp').addEventListener('input',e=>renderList(e.target.value));

function parseTour(t){
  if(!t)return null;
  const MO={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const m=t.match(/([A-Za-z]+)\s+(\d+)/);
  if(m){const mo=MO[m[1].toLowerCase().slice(0,3)];if(mo!==undefined)return{month:mo,day:+m[2],year:new Date().getFullYear()};}
  return null;
}

function renderCal(){
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  document.getElementById('cal-lbl').textContent=`${MN[calMonth]} ${calYear}`;
  const tm={};
  houses.forEach(h=>{const d=parseTour(h.tour);if(d&&d.month===calMonth&&d.year===calYear){if(!tm[d.day])tm[d.day]=[];tm[d.day].push(h);}});
  const today=new Date(),fd=new Date(calYear,calMonth,1).getDay(),dim=new Date(calYear,calMonth+1,0).getDate(),pd=new Date(calYear,calMonth,0).getDate();
  const total=Math.ceil((fd+dim)/7)*7;
  let html=DN.map(d=>`<div class="cal-dh">${d}</div>`).join('');
  for(let c=0;c<total;c++){
    let num,cls='cal-cell',isThis=false;
    if(c<fd){num=pd-fd+c+1;cls+=' other';}
    else if(c>=fd+dim){num=c-fd-dim+1;cls+=' other';}
    else{num=c-fd+1;isThis=true;}
    const isT=isThis&&today.getDate()===num&&today.getMonth()===calMonth&&today.getFullYear()===calYear;
    if(isT)cls+=' today';
    const evts=isThis&&tm[num]?tm[num].map(h=>`<div class="cal-evt" onclick="event.stopPropagation();openDetail(${h.id})">${h.title.slice(0,9)}</div>`).join(''):'';
    html+=`<div class="${cls}"><div class="cal-num">${num}</div>${evts}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}
function chMonth(d){calMonth+=d;if(calMonth>11){calMonth=0;calYear++;}if(calMonth<0){calMonth=11;calYear--;}renderCal();}

function openDetail(id){
  const h=houses.find(x=>x.id===id);if(!h)return;
  document.getElementById('det-sh-title').textContent=h.title;
  const vis=h.visited==='Yes'||h.visited==='Yes (Santi)';
  const rows=[
    h.number&&['Number',h.number],
    h.price&&['Price',h.price],
    ['Visited?',`<span class="badge ${vis?'badge-y':'badge-n'}">${vis?'✓ ':'✗ '}${h.visited}</span>`],
    h.location&&['Location',h.location],
    h.notes&&['Notes',`<span style="font-size:13px">${h.notes}</span>`],
    h.tour&&['Tour',h.tour],
  ].filter(Boolean);
  document.getElementById('det-body').innerHTML=`<div class="det-title">${h.title}</div><div class="det-addr">${h.address}</div><button class="det-edit" onclick="openEdit(${h.id})">&#9998; Edit</button><div class="det-fields">${rows.map(([l,v])=>`<div class="det-row"><span class="det-lbl">${l}</span><span class="det-val">${v}</span></div>`).join('')}</div>`;
  openOv('ov-detail');
}

function openAdd(){
  document.getElementById('form-lbl').textContent='Add House';
  ['f-id','f-title','f-addr','f-num','f-price','f-loc','f-notes','f-tour'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('f-vis').value='No';openOv('ov-form');
}

function openEdit(id){
  const h=houses.find(x=>x.id===id);if(!h)return;
  document.getElementById('form-lbl').textContent='Edit House';
  document.getElementById('f-id').value=h.id;
  document.getElementById('f-title').value=h.title||'';
  document.getElementById('f-addr').value=h.address||'';
  document.getElementById('f-num').value=h.number||'';
  document.getElementById('f-price').value=h.price||'';
  document.getElementById('f-vis').value=h.visited||'No';
  document.getElementById('f-loc').value=h.location||'';
  document.getElementById('f-notes').value=h.notes||'';
  document.getElementById('f-tour').value=h.tour||'';
  openOv('ov-form');
}

async function saveHouse(){
  const id=document.getElementById('f-id').value,addr=document.getElementById('f-addr').value;
  const data={title:document.getElementById('f-title').value,address:addr,number:document.getElementById('f-num').value,price:document.getElementById('f-price').value,visited:document.getElementById('f-vis').value,location:document.getElementById('f-loc').value,notes:document.getElementById('f-notes').value,tour:document.getElementById('f-tour').value};
  if(id){
    const idx=houses.findIndex(h=>h.id===+id),ac=houses[idx].address!==addr;
    data.lat=ac?null:houses[idx].lat;data.lng=ac?null:houses[idx].lng;
    houses[idx]={...houses[idx],...data};
    if(!data.lat){const c=await geo(addr);if(c){houses[idx].lat=c.lat;houses[idx].lng=c.lng;}}
    addMarker(houses[idx]);
  }else{
    const nid=Math.max(0,...houses.map(h=>h.id))+1,nh={id:nid,lat:null,lng:null,...data};
    houses.push(nh);
    const c=await geo(addr);if(c){const i=houses.findIndex(h=>h.id===nid);houses[i].lat=c.lat;houses[i].lng=c.lng;addMarker(houses[i]);}
  }
  save();closeOv('ov-form');closeOv('ov-detail');
  if(curTab==='book')renderList();if(curTab==='tour')renderCal();
}

function openOv(id){document.getElementById(id).classList.add('open');}
function closeOv(id){document.getElementById(id).classList.remove('open');}
['ov-detail','ov-form'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{if(e.target.id===id)closeOv(id);}));

initMap();
</script>
</body>
</html>
